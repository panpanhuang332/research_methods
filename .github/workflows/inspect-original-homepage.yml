name: Inspect original homepage
on:
  push:
    paths:
      - '.github/workflows/inspect-original-homepage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-page inspection tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect only the public homepage and its public visual assets
        run: |
          mkdir -p original-homepage-inspection
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib
          from urllib.parse import urlparse, urljoin
          from playwright.sync_api import sync_playwright
          out = Path('original-homepage-inspection')
          source = 'https://research-methods-18.e5060b85-02c2-4336-b68d-483091a94ab8.chatgpt.site/'
          host = urlparse(source).netloc
          report = {'source':source,'pages':[],'assets':[],'errors':[]}
          responses = {}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context()
              page = context.new_page()
              def record(response):
                  u = response.url
                  kind = response.request.resource_type
                  if urlparse(u).netloc != host or kind not in ('image','stylesheet','script') or response.status != 200:
                      return
                  if re.search(r'\.(woff2?|ttf|otf|eot)(?:\?|$)',u,re.I):
                      return
                  try:
                      body=response.body()
                      if len(body)>4000000:return
                      ext=Path(urlparse(u).path).suffix or {'image':'.img','stylesheet':'.css','script':'.js'}[kind]
                      name=hashlib.sha256(u.encode()).hexdigest()[:12]+ext
                      (out/name).write_bytes(body)
                      responses[u]={'url':u,'file':name,'size':len(body),'kind':kind,'sha256':hashlib.sha256(body).hexdigest()}
                  except Exception as e:report['errors'].append(str(e))
              page.on('response',record)
              for width,height in [(1440,900),(390,844),(320,667)]:
                  try:
                      page.set_viewport_size({'width':width,'height':height})
                      response=page.goto(source,wait_until='networkidle',timeout=60000)
                      page.wait_for_timeout(1500)
                      page.evaluate('document.fonts.ready')
                      name=f'original-{width}'
                      (out/(name+'.html')).write_text(page.content(),encoding='utf-8')
                      page.screenshot(path=str(out/(name+'.png')),full_page=True)
                      entry=page.evaluate('''() => {
                        const box=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
                        const visual=e=>{const s=getComputedStyle(e);return {tag:e.tagName,cls:e.className,text:(e.innerText||'').slice(0,300),box:box(e),background:s.backgroundImage,color:s.color,font:s.font,fontFamily:s.fontFamily,objectFit:s.objectFit,objectPosition:s.objectPosition}};
                        return {title:document.title,text:document.body.innerText,bodyClass:document.body.className,htmlClass:document.documentElement.className,
                          images:[...document.images].map(e=>({...visual(e),src:e.src,currentSrc:e.currentSrc,srcset:e.srcset,outer:e.parentElement.tagName==='PICTURE'?e.parentElement.outerHTML:e.outerHTML})),
                          elements:[...document.querySelectorAll('h1,h2,h3,a,button,header,footer,main,section')].map(visual),
                          backgrounds:[...document.querySelectorAll('*')].filter(e=>getComputedStyle(e).backgroundImage.includes('url(')).map(visual),
                          links:[...document.querySelectorAll('a')].map(e=>({text:e.innerText,href:e.href})),
                          stylesheets:[...document.styleSheets].map(s=>{try{return {href:s.href,rules:[...s.cssRules].map(r=>r.cssText).join('\\n')}}catch(e){return{href:s.href,error:String(e)}}})};
                      }''')
                      entry.update({'viewport':[width,height],'status':response.status if response else None,'final_url':page.url})
                      (out/(name+'.json')).write_text(json.dumps(entry,ensure_ascii=False,indent=2),encoding='utf-8')
                      report['pages'].append({k:entry[k] for k in ['viewport','status','final_url','title','images','links']})
                  except Exception as e:
                      report['errors'].append(str(e))
              browser.close()
          report['assets']=list(responses.values())
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          if not report['pages'] or report['pages'][0]['status']!=200:raise SystemExit('Original public homepage could not be inspected; no production homepage changed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-homepage-inspection
          path: original-homepage-inspection/
          retention-days: 3
          if-no-files-found: error
