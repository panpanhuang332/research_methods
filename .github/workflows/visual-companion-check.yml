name: Visual companion checks

on:
  push:
    paths:
      - 'visuals/**'
      - '.github/workflows/visual-companion-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Check SVGs, mobile layout and interactions
        run: python visuals/tests/check_visuals.py
      - name: Upload standalone HTML, source, SVGs and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-methods-visual-companion
          path: visuals-dist/
          if-no-files-found: error
          retention-days: 7
