name: Root homepage checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/original-homepage/**'
      - 'tests/check_homepage.py'
      - '.github/workflows/root-homepage-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: root-homepage-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify restored source images, layout and exact live deployment
        env:
          CHECK_LIVE: '1'
        run: python tests/check_homepage.py
      - name: Save report and screenshots (no font files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-homepage-verification
          path: homepage-qa/
          retention-days: 7
          if-no-files-found: error
